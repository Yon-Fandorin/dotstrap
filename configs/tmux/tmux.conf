# ~/.tmux.conf - Managed by dotstrap

# Shell — pinned to the resolved zsh path by scripts/tmux.sh so new panes do not
# inherit a stale $SHELL (e.g. bash) from the session that launched tmux.
set -g default-shell __ZSH_PATH__

# Terminal behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000

# Session and pane defaults
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard on
set -g mouse on
setw -g mode-keys vi

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Windows and panes open in the current directory
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style copy mode
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; else cat >/dev/null; fi'

# Catppuccin Mocha-inspired status line
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#89b4fa,fg=#11111b"
set -g mode-style "bg=#89b4fa,fg=#11111b"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#89b4fa,fg=#11111b,bold] #I:#W "
set -g status-left-length 40
set -g status-left "#[bg=#a6e3a1,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#a6e3a1] "
set -g status-right-length 80
set -g status-right "#[fg=#f5c2e7]#(whoami) #[fg=#94e2d5]%Y-%m-%d #[fg=#cba6f7]%H:%M "
