# ~/.tmux.conf - Managed by dotstrap

# Shell — pinned to the resolved zsh path by scripts/tmux.sh so new panes do not
# inherit a stale $SHELL (e.g. bash) from the session that launched tmux.
set -g default-shell __ZSH_PATH__

# ── Terminal behavior ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",ghostty:RGB"
set -g focus-events on
set -g escape-time 10
set -g repeat-time 400
set -g history-limit 100000
set -g allow-passthrough on

# ── Session and pane defaults ─────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard on
set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
setw -g aggressive-resize on
setw -g monitor-activity on
set -g visual-activity off
set -g display-time 2000
set -g display-panes-time 2000

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Reload ────────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# ── Splits (| % horizontal, - " vertical) + new window, all in current dir ────
bind | split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Window management ─────────────────────────────────────────────────────────
bind Tab last-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind S set-window-option synchronize-panes \; \
    display-message "synchronize-panes #{?synchronize-panes,ON,off}"

# ── Popups (tmux 3.2+) ────────────────────────────────────────────────────────
bind g display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# ── Pane navigation (prefix) — seamless C-h/j/k/l comes from vim-tmux-navigator ─
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Vi-style copy mode (system clipboard via tmux-yank binds y / mouse drag) ───
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind p paste-buffer
bind P choose-buffer
# vim-tmux-navigator takes the no-prefix C-l, so prefix C-l clears the screen.
bind C-l send-keys 'C-l'

# ─── Catppuccin Mocha powerline status bar (top) ─────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-style "bg=#313244,fg=#cdd6f4"
set -g message-style "bg=#89b4fa,fg=#11111b"
set -g mode-style "bg=#89b4fa,fg=#11111b"
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa"

# Left: session block (▶ window tabs ▶ … ▶ clock)
set -g status-left-length 60
set -g status-left "#[fg=#11111b,bg=#a6e3a1,bold] #S "

# Window tabs — each tab a powerline arrow-block (inactive grey, active blue)
set -g window-status-separator ""
set -g window-status-format "#{?window_start_flag,#[fg=#a6e3a1#,bg=#313244],}#[fg=#7f849c,bg=#313244] #{?#{m:*nvim*,#{pane_current_command}},,#{?#{m:*vim,#{pane_current_command}},,#{?#{m:lazygit,#{pane_current_command}},,#{?#{m:git,#{pane_current_command}},,#{?#{m:ssh,#{pane_current_command}},,#{?#{m:python*,#{pane_current_command}},,#{?#{m:node,#{pane_current_command}},,#{?#{m:cargo,#{pane_current_command}},,#{?#{m:zsh,#{pane_current_command}},,#{?#{m:bash,#{pane_current_command}},,#{?#{m:fish,#{pane_current_command}},,}}}}}}}}}}} #W #I "
set -g window-status-current-format "#{?window_start_flag,#[fg=#a6e3a1#,bg=#89b4fa],#[fg=#313244#,bg=#89b4fa]}#[fg=#11111b,bg=#89b4fa,bold] #{?#{m:*nvim*,#{pane_current_command}},,#{?#{m:*vim,#{pane_current_command}},,#{?#{m:lazygit,#{pane_current_command}},,#{?#{m:git,#{pane_current_command}},,#{?#{m:ssh,#{pane_current_command}},,#{?#{m:python*,#{pane_current_command}},,#{?#{m:node,#{pane_current_command}},,#{?#{m:cargo,#{pane_current_command}},,#{?#{m:zsh,#{pane_current_command}},,#{?#{m:bash,#{pane_current_command}},,#{?#{m:fish,#{pane_current_command}},,}}}}}}}}}}} #W #I #[fg=#89b4fa,bg=#313244]"

# Right: date block ◀ time block
set -g status-right-length 50
set -g status-right "#[fg=#45475a,bg=#313244]#[fg=#cdd6f4,bg=#45475a] %Y-%m-%d #[fg=#cba6f7,bg=#45475a]#[fg=#11111b,bg=#cba6f7,bold] %H:%M "

# ─── Plugins (no TPM; cloned by scripts/tmux-plugins.sh) ─────────────────────
# Session persistence (tmux-resurrect + tmux-continuum)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Clipboard (tmux-yank) — y / mouse-drag copy to the system clipboard.
set -g @yank_selection_mouse 'clipboard'

# Session manager (sesh) — prefix + t to fuzzy-find / create sessions
bind t run-shell "command -v sesh >/dev/null 2>&1 && sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --border-label ' sesh ' --prompt '> ')\""

# Load plugins last; continuum must come after resurrect.
if-shell '[ -f ~/.config/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux ]' 'run-shell ~/.config/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux'
if-shell '[ -f ~/.config/tmux/plugins/tmux-yank/yank.tmux ]' 'run-shell ~/.config/tmux/plugins/tmux-yank/yank.tmux'
if-shell '[ -f ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux ]' 'run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell '[ -f ~/.config/tmux/plugins/tmux-continuum/continuum.tmux ]' 'run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux'
